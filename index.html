-family:"DejaVu Sans",Arial,sans-serif;font-weight:600;font-size:clamp(16px,2.3vw,21px);margin:12px 0;line-height:1.9;overflow-wrap:anywhere}.chem sub,.chem sup{font-size:.69em}.equation-inline{direction:ltr;unicode-bidi:isolate;display:inline-block}button{font-family:inherit}button.primary,button.secondary,button.ghost{border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:700;font-size:15px}.primary{background:var(--blue);color:white;border:1px solid var(--blue)}.secondary{background:#edf5fc;color:#1e578c;border:1px solid #b7cfe3}.ghost{background:white;color:var(--muted);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.choices{display:grid;gap:8px;margin:10px 0}.option{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);padding:9px 12px;border-radius:10px;cursor:pointer;background:white}.option:has(input:checked){border-color:var(--blue);background:#eaf3ff}.option input{margin-top:6px;accent-color:var(--blue)}.tag{font-size:12px;padding:3px 9px;background:#e8f0fc;color:#315177;border-radius:50px;font-weight:bold}.success{background:#e5f5ed;border-right:4px solid #23815b;padding:12px;border-radius:10px}.wrong{background:#fff1eb;border-right:4px solid #cb6a3b;padding:12px;border-radius:10px}.heat-map{position:relative;display:grid;grid-template-columns:1fr 70px 1fr;gap:6px;align-items:center;text-align:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#f9fbff}.heat-circle{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin:8px auto;background:#ffede0;border:2px solid #edbb92;font-size:40px;transition:background .4s}.heat-circle.cool{background:#e0f0ff;border-color:#8bbddf}.heat-flow{font-size:35px;color:var(--orange);animation:pulse 1.4s infinite alternate}.heat-flow.cool{color:var(--blue)}@keyframes pulse{from{opacity:.35;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}.meter{height: </style></head><body><header><h1>⚗️ מעבדת שיווי משקל כימי</h1><p>כימיה כללית 2545 · מכללת אורנים · חקר, הדרכה ותרגול עצמי</p></header><main class="shell"><nav class="tabs" id="tabs"></nav><section id="content" aria-live="polite"></section><footer>הסימולציות הן מודלים לימודיים. קבועי שיווי המשקל המספריים בסימולציה ובשאלות הם ערכים להמחשה, אלא אם צוין אחרת.</footer></main>
<script src="scorm.js"></script><script id="questions" type="application/json">{"lechatelier": [{"id": "L01", "area": "ריכוז", "question": "מוסיפים Fe³⁺ לתמיסה בשיווי משקל, בטמפרטורה ונפח קבועים. מה קורה לכמות הקומפלקס לאחר ההתאמה?", "reaction": "Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq)", "options": ["גדלה", "קטנה", "לא משתנה", "יורדת לאפס"], "answer": 0, "explanation": "הוספת מגיב מעדיפה את יצירת הקומפלקס."}, {"id": "L02", "area": "ריכוז", "question": "מוציאים חלק מ־FeSCN²⁺ מהתמיסה, ללא שינוי נפח או טמפרטורה. כיצד תתקדם התגובה נטו?", "reaction": "Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq)", "options": ["לכיוון המגיבים", "לכיוון התוצרים", "לא תהיה הסטה", "לא ניתן לקבוע"], "answer": 1, "explanation": "הוצאת תוצר מעדיפה יצירה נוספת שלו."}, {"id": "L03", "area": "ריכוז", "question": "מוסיפים HI לכלי בשיווי משקל, בטמפרטורה ונפח קבועים. מה קורה לכמות H₂ במהלך ההתאמה שלאחר ההוספה?", "reaction": "H₂(g) + I₂(g) ⇌ 2HI(g)", "options": ["קטנה", "לא משתנה", "גדלה", "מוכפלת בהכרח"], "answer": 2, "explanation": "הוספת תוצר מעדיפה את התגובה ההפוכה, שמייצרת H₂."}, {"id": "L04", "area": "ריכוז", "question": "מוציאים חלק מן H₂ מכלי בשיווי משקל, בנפח וטמפרטורה קבועים. לאיזה כיוון תתקדם התגובה?", "reaction": "H₂(g) + I₂(g) ⇌ 2HI(g)", "options": ["ישירה", "הפוכה", "אין הסטה", "לפי הלחץ בלבד"], "answer": 1, "explanation": "הוצאת מגיב מעדיפה את הכיוון שמייצר אותו מחדש."}, {"id": "L05", "area": "ריכוז", "question": "מוסיפים CO לכלי בנפח וטמפרטורה קבועים. מה קורה לכמות CO₂ במהלך ההתאמה?", "reaction": "CO(g) + H₂O(g) ⇌ CO₂(g) + H₂(g)", "options": ["קטנה", "גדלה", "לא משתנה", "הופכת לאפס"], "answer": 1, "explanation": "הוספת CO מעדיפה את התגובה הישירה המייצרת CO₂."}, {"id": "L06", "area": "ריכוז", "question": "מוסיפים NH₃ לכלי בשיווי משקל בנפח וטמפרטורה קבועים. מה קורה לכמות N₂ במהלך ההתאמה?", "reaction": "N₂(g) + 3H₂(g) ⇌ 2NH₃(g)", "options": ["קטנה", "גדלה", "לא משתנה", "בהכרח מוכפלת"], "answer": 1, "explanation": "הוספת NH₃, שהוא תוצר, מעדיפה את התגובה ההפוכה."}, {"id": "L07", "area": "ריכוז", "question": // Solve the equilibrium extent at fixed volume and target K. Numerically stable monotonic lnQ root.
function lnQ(c,nu){return c.reduce((s,x,i)=>s+nu[i]*Math.log(Math.max(x,1e-250)),0)}
function solve(initial,nu,K){let lo=-Infinity,hi=Infinity;for(let i=0;i<nu.length;i++){if(nu[i]>0)lo=Math.max(lo,-initial[i]/nu[i]);if(nu[i]<0)hi=Math.min(hi,initial[i]/(-nu[i]));}let a=lo+1e-11,b=hi-1e-11;for(let it=0;it<90;it++){let x=(a+b)/2, q=lnQ(initial.map((v,i)=>v+nu[i]*x),nu);if(q<Math.log(K))a=x;else b=x;}let x=(a+b)/2;return initial.map((v,i)=>Math.max(0,v+nu[i]*x));}
function makeModel(){let s=state,eq,initial,nu,labels,delta=0,T=null,K0,K;let snapshot;

 let r=thermal[s.caseKind];eq=r.eq;labels=r.species;initial=[...r.initial];nu=r.nu;T=r.T+(s.disturb==='heat'?20:-20);K0=Math.exp(lnQ(initial,nu));K=K0*Math.exp(-r.dh/8.314*(1/T-1/r.T));snapshot=initial;delta=r.dh;
}else if(s.lab==='concentration'){
 eq='Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq)';labels=['Fe³⁺','SCN⁻','FeSCN²⁺'];initial=[.4,.4,.2];nu=[-1,-1,1];K=1.25;K0=K;snapshot=[...initial];let key=s.disturb;if(key==='addreactant')snapshot[0]+=.20;if(key==='removereactant')snapshot[0]-=.15;if(key==='addproduct')snapshot[2]+=.15;if(key==='removeproduct')snapshot[2]-=.10;
}else{
 if(s.disturb==='equal'){eq='H₂(g) + I₂(g) ⇌ 2HI(g)';labels=['H₂','I₂','HI'];initial=[.4,.4,.8];nu=[-1,-1,2];}
 else{eq='N₂O₄(g) ⇌ 2NO₂(g)';labels=['N₂O₄','NO₂'];initial=[.4,.4];nu=[-1,2];}
 K0=Math.exp(lnQ(initial,nu));K=K0;let factor=s.disturb==='expand'?.5:2;snapshot=initial.map(x=>x*factor);

let final=solve(snapshot,nu,K),before=[...initial];let extent=(final[0]-snapshot[0])/nu[0];let shift=Math.abs(extent)<1e-7?'none':extent>0?'right':'left';let spec=s.lab==='concentration'?labels[1]:labels.at(-1);return {eq,labels,before,snapshot,final,shift,species:spec,K,K0,T,delta,nu};}

if(l==='volume')controls=`<p>כל החומרים בתגובות אלה גזים אידאליים. הטמפרטורה קבועה.</p>${choices('l-vol',[['compress','להקטין נפח: N₂O₄ / NO₂'],['expand','להגדיל נפח: N₂O₄ / NO₂'],['equal','להקטין נפח: H₂ / I₂ / HI (אותו מספר מול גז)']],dist,'labDist')}<div class="callout warning">בספירת מולים מתייחסים רק לחומרים גזיים ולמקדמים במשוואה, לא למספר הסוגים של החומרים.</div>`;
let explain=l==='temperature'?(m.shift==='right'?'השינוי מעדיף את התגובה הישירה.':'השינוי מעדיף את התגובה ההפוכה.')+' חימום מעדיף כיוון קולט חום; קירור מעדיף כיוון פולט חום.':l==='volume'?(dist==='equal'?'יש שני מול גז בכל צד; הדחיסה מעלה ריכוזים ולחץ בלי הסטה.':dist==='compress'?'דחיסה מעדיפה את הצד עם פחות מול גז.':'הרחבת נפח מעדיפה את הצד עם יותר מול גז.'):'המערכת מגיבה להוספה או להוצאה על ידי העדפת הכיוון הצורך את התוספת או מחדש את החומר שהוצא.';
return `<article class="section">${top}<h3>תחנה: ${heading[l]}</h3>${controls}<div class="panel">${math(m.eq)}<p class="small muted" style="text-align:center">התגובה מאוזנת; המערכת נמצאת בתחילה בשיווי משקל.</p></div><h3>שלב 1 — חיזוי</h3><p>לאיזה כיוון תתקדם התגובה <strong>נטו במהלך ההתאמה</strong>?</p>${choices('labshift',[['right','לכיוון התוצרים'],['left','לכיוון המגיבים'],['none','לא תהיה הסטה של שיווי המשקל']],state.labPredict,'labPredict')}<p>מה יקרה לכמות <strong>${m.species}</strong> <u>במהלך ההתאמה מהמצב שמיד לאחר ההפרעה</u>?</p>${choices('labspecies',[['up','תגדל'],['down','תקטן'],['same','לא תשתנה']],state.labSpecies,'labSpecies')}<div class="actions"><button class="primary" onclick="runLab()" ${!state.labPredict||!state.labSpecies?'disabled':''}>▶ בצעו את ההפרעה וצפו בתוצאות</button><button class="ghost" onclick="labReset()">↺ איפוס התחנה</button></div>${s?`<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>שלב 2 — מה השתנה בפועל?</h3>${showStages(m)}${plotModel(m)}<div class="${state.labPredict===m.shift?'success':'wrong'}"><b>כיוון:</b> ${m.shift==='none'?'ללא הסטה':m.shift==='right'?'לכיוון התוצרים':'לכיוון המגיבים'}. ${state.labPredict===m.shift?'החיזוי נכון.':'בדקו שוב את החיזוי.'}</div><div class="${state.labSpecies===(Math.abs(m.final[m.labels.indexOf(m.species)]-m.snapshot[m.labels.indexOf(m.species)])<1e-7?'same':m.final[m.labels.indexOf(m.species)]>m.snapshot[m.labels.indexOf(m.species)]?'up':'down')?'success':'wrong'}" style="margin-top:8px"><b>שינוי בכמות ${m.species}:</b> ${round(m.snapshot[m.labels.indexOf(m.species)])} → ${round(m.final[m.labels.indexOf(m.species)])} M. ${explain}</div><div class="callout">${l==='temperature'?'הטמפרטורה היא המשתנה שהסביבה קובעת. בהרכב שיווי המשקל משתנים כמויות החומרים. בניגוד לשינויי ריכוז ונפח, שינוי טמפרטורה משנה גם את K.':l==='volume'?'הנפח משתנה בבת אחת ולכן כל הריכוזים משתנים מיד. ההסטה, אם קיימת, מתרחשת לאחר מכן.':'שימו לב: הריכוז שנוסף או הוצא משתנה מיידית, ואחר כך מתרחשת תגובת ההתאמה.'}</div>`:''}</article>`}
function labTab(v){state.lab=v;state.disturb=v==='concentration'?'addreactant':v==='volume'?'compress':'heat';labReset()}function labCase(v){state.caseKind=v;labReset()}function labDist(v){state.disturb=v;labReset()}function labPredict(v){state.labPredict=v;state.labRun=false;render()}function labSpecies(v){state.labSpecies=v;state.labRun=false;render()}function runLab(){state.labRun=true;render()}function labReset(){state.labPredict='';state.labSpecies='';state.labRun=false;render()}
function renderGuide(){let i=state.guideStep,ans=state.guideAnswers,correct=['double','keep','48'];return `<article class="section"><h2>🧩 דוגמה אחת מודרכת — צירוף שתי משוואות</h2><p>אחרי הדוגמה הזאת, השאלות יהיו עצמאיות. מומלץ לפתור על דף ולא להסתפק בניחוש מספר.</p><div class="panel"><b>נתון:</b>${math('NO(g) + ½O₂(g) ⇌ NO₂(g)       K₁ = 4')}${math('2NO₂(g) ⇌ N₂O₄(g)       K₂ = 3')}<b>תגובת המטרה:</b>${math('2NO(g) + O₂(g) ⇌ N₂O₄(g)')}</div><div class="stepper">${['מקדמי התגובה הראשונה','התגובה השנייה','הקבוע החדש'].map((n,j)=>`<button class="${i===j?'active':''}" onclick="state.guideStep=${j};state.guideFeedback=false;render()">${j+1}. ${n}</button>`).join('')}</div>${i===0?'<h3>מה נעשה לתגובה הראשונה?</h3>':i===1?'<h3>מה נעשה לתגובה השנייה?</h3>':'<h3>מהו הקבוע לתגובת המטרה?</h3>'}${i<2?choices('guide'+i,[['keep','נשאיר ללא שינוי'],['reverse','נהפוך את הכיוון'],['double','נכפיל את כל המקדמים ב־2']],ans[i],'guideSelect'):choices('guide2',[['12','12'],['48','48'],['7','7'],['16','16']],ans[i],'guideSelect')}<div class="actions"><button class="primary" onclick="state.guideFeedback=true;render()" ${!ans[i]?'disabled':''}>בדיקת השלב</button><button class="ghost" onclick="state.guideStep=0;state.guideAnswers=['','',''];state.guideFeedback=false;render()">התחלה מחדש</button></div>${state.guideFeedback?`<div class="${ans[i]===correct[i]?'success':'wrong'}">${ans[i]===correct[i]?(i===0?'נכון. הכפלת התגובה הראשונה ב־2 נותנת 2NO + O₂ ⇌ 2NO₂.':i===1?'נכון. NO₂ נוצר בראשונה ונצרך בשנייה, ולכן מתבטל.':'נכון. K = 4² × 3 = 48.'):'לא בדיוק. השוו כל מקדם בתגובת המטרה והקפידו על ביטול חומרי הביניים.'}${ans[i]===correct[i]&&i<2?`<div class="actions"><button class="primary" onclick="state.guideStep=${i+1};state.guideFeedback=false;render()">לשלב הבא</button></div>`:''}${ans[i]===correct[i]&&i===2?`<div class="actions"><button class="primary" onclick="state.bank='kc';state.qIndex=4;go('quiz')">לשאלות עצמאיות</button></div>`:''}</div>`:''}<div class="callout warning">בהמשך לא נסמן עבורכם אילו משוואות צריך להפוך או להכפיל — זו בדיוק המיומנות שעליכם לפתח.</div></article>`}
function guideSelect(v){state.guideAnswers[state.guideStep]=v;state.guideFeedback=false;render()}
function renderQuiz(){let bank=state.bank,arr=DATA[bank],i=state.qIndex,q=arr[i],key=bank+'-'+i,val=state.answers[key]??'',checked=!!state.checks[key],correct=bank==='kc'?val.trim()!==''&&Number.isFinite(Number(val))&&Math.abs(Number(val)-q.answer)<=Math.abs(q.answer)*.05:Number(val)===q.answer;let answered=arr.filter((_,j)=>state.checks[bank+'-'+j]).length;let score=arr.filter((item,j)=>{let id=bank+'-'+j,v=state.answers[id];return state.checks[id]&&(bank==='kc'?v!==undefined&&v.trim()!==''&&Number.isFinite(Number(v))&&Math.abs(Number(v)-item.answer)<=Math.abs(item.answer)*.05:Number(v)===item.answer)}).length;let body=bank==='kc'?`<p>${escapeHTML(q.question)}</p><div class="panel"><strong>התגובות הנתונות — K באותה טמפרטורה:</strong>${q.lines.map(math).join('')}<hr style="border:0;border-top:1px solid var(--line)"><strong>תגובת המטרה:</strong>${math(q.target)}</div><p>הקלידו ערך מספרי של Kc (ניתן לכתוב 2.5e-3). <b>טווח קבלה: ±5% מהערך הנכון.</b></p><input class="num" id="numeric" dir="ltr" inputmode="decimal" aria-label="תשובה מספרית" type="text" value="${escapeHTML(val)}" oninput="saveNumeric(this.value)" placeholder="Kc = ?">`: `<p>${escapeHTML(q.question)}</p><div class="panel">${math(q.reaction)}</div>${choices('quiz'+i,q.options.map((o,j)=>[String(j),escapeHTML(o)]),val,'quizSelect')}`;
return `<article class="section"><h2>✅ בדיקה עצמית</h2><p>שאלות ללא רמזי פתרון. משוב לאחר ההגשה, מספר ניסיונות בלתי מוגבל.</p><div class="subtabs"><button class="${bank==='lechatelier'?'active':''}" onclick="setBank('lechatelier')">לה־שטליה · 25 שאלות</button><button class="${bank==='kc'?'active':''}" onclick="setBank('kc')">שינוי Kc · 13 שאלות</button></div><div class="question-top"><strong>שאלה ${i+1} מתוך ${arr.length}</strong><span class="tag">${bank==='kc'?'דרגה '+q.level:q.area}</span><span class="small">הוגשו ${answered} · נכונות ${score}</span></div><div class="progress"><span style="width:${100*answered/arr.length}%"></span></div><div class="panel"><div class="float-buttons">${arr.map((x,j)=>`<button aria-label="שאלה ${j+1}" title="שאלה ${j+1}" class="${i===j?'selected':''}" onclick="state.qIndex=${j};render()">${j+1}</button>`).join('')}</div></div><h3>פתרו בעצמכם</h3>${body}<div class="actions"><button class="primary" onclick="checkQuiz()" ${val===''?'disabled':''}>הגשת תשובה ובדיקתה</button><button class="ghost" onclick="state.qIndex=Math.max(0,state.qIndex-1);render()" ${i===0?'disabled':''}>הקודמת</button><button class="secondary" onclick="state.qIndex=Math.min(${arr.length-1},state.qIndex+1);render()" ${i===arr.length-1?'disabled':''}>הבאה</button></div>${checked?`<div class="${correct?'success':'wrong'}"><strong>${correct?'✓ תשובה נכונה':'כדאי לעיין בדרך הפתרון ולנסות שוב'}</strong><p>${escapeHTML(q.explanation)}</p>${bank==='kc'?`<div class="small">תשובת הייחוס: <span dir="ltr">${q.answer}</span> (טווח קבלה ±5%)</div>`:''}</div>`:''}<div class="actions"><button class="ghost" onclick="restartBank()">↺ איפוס כל התשובות במקבץ זה</button></div></article>`}
function setBank(b){state.bank=b;state.qIndex=0;render()}function quizSelect(v){let key=state.bank+'-'+state.qIndex;state.answers[key]=v;delete state.checks[key];render()}function saveNumeric(v){let key=state.bank+'-'+state.qIndex;state.answers[key]=v;delete state.checks[key];}function checkQuiz(){let key=state.bank+'-'+state.qIndex;if(state.bank==='kc'){let el=$('numeric');state.answers[key]=el.value.trim();}state.checks[key]=true;if(DATA.lechatelier.every((_,i)=>state.checks['lechatelier-'+i])&&DATA.kc.every((_,i)=>state.checks['kc-'+i]))window.oranimSCORM.completed();render()}function restartBank(){let prefix=state.bank+'-';Object.keys(state.answers).filter(x=>x.startsWith(prefix)).forEach(k=>delete state.answers[k]);Object.keys(state.checks).filter(x=>x.startsWith(prefix)).forEach(k=>delete state.checks[k]);state.qIndex=0;render()}
render();
</script></body></html>
